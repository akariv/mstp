<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f6fc" />
    <script>
      // Apply the saved colour scheme, mode and font before first paint (logic mirrors src/lib/appearance.ts).
      (function () {
        var a = {};
        try { a = JSON.parse(localStorage.getItem('appearance') || '{}') || {}; } catch (e) {}
        var r = document.documentElement;
        var dark = a.mode === 'dark' || (a.mode !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        r.setAttribute('data-palette', a.palette || 'schrift');
        r.setAttribute('data-font', a.font || 'sans');
        r.setAttribute('data-mode', dark ? 'dark' : 'light');
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap"
      rel="stylesheet"
    />
    <title>Toetstrainer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
