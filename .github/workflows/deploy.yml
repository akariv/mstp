name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write # for Workload Identity Federation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build web app
        run: npm run build -w web
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/2150730116/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@mstp-509920.iam.gserviceaccount.com
      - name: Deploy to Firebase
        run: npx firebase deploy --only firestore,storage,functions,hosting --project mstp-509920 --non-interactive --force
